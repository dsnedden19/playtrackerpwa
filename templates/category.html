<link rel="stylesheet" href="/static/style.css">

<div class="container selector-container">
    <header class="selector-header">
        <div>
            <h2>Game Tracker</h2>
            <p id="active-game-label">Choose a category, type, play, then record stats.</p>
        </div>
        <nav class="selector-nav">
            <a href="/summary" class="button">Summary</a>
            <a href="/" class="button">Home</a>
        </nav>
    </header>

    <main class="selector-board">
        <div class="selector-left-stack">
            <section class="selector-panel category-panel">
                <h3>Category</h3>
                <div id="category-options" class="selector-options"></div>
            </section>
            <section class="selector-panel type-panel">
                <h3>Type</h3>
                <div id="type-options" class="selector-options"></div>
            </section>
        </div>
        <section class="selector-panel plays-panel">
            <h3>Plays</h3>
            <div id="play-options" class="play-options"></div>
        </section>
        <section class="selector-panel stats-panel">
            <h3>Stats</h3>
            <div id="stat-options" class="stat-options"></div>
        </section>
        <section class="shot-tracker" aria-labelledby="shot-tracker-title">
            <div class="shot-chart-content">
                <div class="shot-tracker-heading">
                    <h3 id="shot-tracker-title">Shot Chart</h3>
                    <p id="shot-status" role="status" aria-live="polite">Tap the court to place a shot.</p>
                </div>
                <p id="selected-shot-location">Tap the court to choose a location.</p>
                <div class="shot-chart-row">
                    <svg id="shot-court" class="shot-court" viewBox="0 0 305 275"
                         role="application" aria-labelledby="court-title court-description">
                        <title id="court-title">Half-court shot chart</title>
                        <desc id="court-description">Tap the supplied half-court image to place a shot. The baseline is at the top, half court at the bottom, and the lower-left corner is coordinate zero, zero.</desc>
                        <rect class="court-backdrop" x="17" y="21" width="264" height="231"></rect>
                        <image class="court-image" href="/static/court-half.png"
                               x="0" y="0" width="305" height="275"
                               preserveAspectRatio="none"></image>
                        <g id="shot-markers" aria-hidden="true"></g>
                        <g id="pending-shot-marker" aria-hidden="true"></g>
                        <rect class="court-tap-area" x="17" y="21" width="264" height="231"
                              role="button" tabindex="0" aria-label="Tap to place a shot on the court"></rect>
                    </svg>
                    <div class="shot-result-buttons">
                        <button type="button" id="shot-made" class="shot-result made" disabled>Made</button>
                        <button type="button" id="shot-missed" class="shot-result missed" disabled>Miss</button>
                    </div>
                </div>
                <p class="shot-coordinate-help">0–1000 grid from the lower-left corner.</p>
            </div>
        </section>
    </main>
</div>

<script src="/static/storage.js"></script>
<script>
    const selectorConfig = {{ selector_config | tojson }};
    const offenseCounters = {{ offense_counters | tojson }};
    const defenseCounters = {{ defense_counters | tojson }};
    const gameId = localStorage.getItem("activeGameId");

    let selectedCategory = "Offense";
    let selectedType = "Man";
    let selectedPlay = selectorConfig[selectedCategory][selectedType].plays[0];
    let selectedShotLocation = null;

    const categoryOptions = document.getElementById("category-options");
    const typeOptions = document.getElementById("type-options");
    const playOptions = document.getElementById("play-options");
    const statOptions = document.getElementById("stat-options");
    const shotStatus = document.getElementById("shot-status");
    const shotMadeButton = document.getElementById("shot-made");
    const shotMissedButton = document.getElementById("shot-missed");
    const selectedShotLocationLabel = document.getElementById("selected-shot-location");
    const shotCourt = document.getElementById("shot-court");
    const courtTapArea = shotCourt.querySelector(".court-tap-area");
    const shotMarkers = document.getElementById("shot-markers");
    const pendingShotMarker = document.getElementById("pending-shot-marker");
    const COURT_BOUNDS = { left: 17, top: 21, right: 281, bottom: 252 };

    function clearShotLocation() {
        selectedShotLocation = null;
        pendingShotMarker.replaceChildren();
        selectedShotLocationLabel.textContent = "Tap the court to choose a location.";
        shotMadeButton.disabled = true;
        shotMissedButton.disabled = true;
        shotStatus.textContent = gameId
            ? "Tap the court to place a shot."
            : "Start or resume a game before recording shots.";
    }

    function drawShotMarker(container, x, y, result, pending = false) {
        const marker = document.createElementNS("http://www.w3.org/2000/svg", "g");
        marker.setAttribute("transform", `translate(${x} ${y})`);
        marker.setAttribute("class", `shot-marker ${pending ? "pending" : result}`);
        if (result === "missed") {
            const cross = document.createElementNS("http://www.w3.org/2000/svg", "path");
            cross.setAttribute("d", "M-6 -6 L6 6 M6 -6 L-6 6");
            cross.setAttribute("class", "shot-marker-x");
            marker.appendChild(cross);
        } else {
            const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            dot.setAttribute("r", pending ? "7" : "6");
            dot.setAttribute("class", "shot-marker-dot");
            marker.appendChild(dot);
        }
        container.appendChild(marker);
    }

    function renderShotMarkers(shots) {
        shotMarkers.replaceChildren();
        shots.forEach(shot => {
            if (Number.isInteger(shot.x) && Number.isInteger(shot.y)) {
                const x = COURT_BOUNDS.left +
                    (shot.x / 1000) * (COURT_BOUNDS.right - COURT_BOUNDS.left);
                const y = COURT_BOUNDS.bottom -
                    (shot.y / 1000) * (COURT_BOUNDS.bottom - COURT_BOUNDS.top);
                drawShotMarker(shotMarkers, x, y, shot.result);
            }
        });
    }

    async function refreshShotMarkers() {
        if (!gameId) {
            renderShotMarkers([]);
            return;
        }
        const shots = await loadGameShots(gameId);
        renderShotMarkers(shots);
    }

    function setShotLocation(clientX, clientY) {
        if (!gameId) {
            shotStatus.textContent = "Start or resume a game before recording shots.";
            return;
        }
        const screenMatrix = shotCourt.getScreenCTM();
        if (!screenMatrix) {
            shotStatus.textContent = "Court coordinates are unavailable. Please try again.";
            return;
        }
        const point = shotCourt.createSVGPoint();
        point.x = clientX;
        point.y = clientY;
        const courtPoint = point.matrixTransform(screenMatrix.inverse());
        const clampedX = Math.min(COURT_BOUNDS.right, Math.max(COURT_BOUNDS.left, courtPoint.x));
        const clampedY = Math.min(COURT_BOUNDS.bottom, Math.max(COURT_BOUNDS.top, courtPoint.y));
        selectedShotLocation = {
            x: Math.round(
                ((clampedX - COURT_BOUNDS.left) /
                    (COURT_BOUNDS.right - COURT_BOUNDS.left)) * 1000
            ),
            y: Math.round(
                ((COURT_BOUNDS.bottom - clampedY) /
                    (COURT_BOUNDS.bottom - COURT_BOUNDS.top)) * 1000
            ),
            courtX: clampedX,
            courtY: clampedY
        };
        pendingShotMarker.replaceChildren();
        drawShotMarker(
            pendingShotMarker,
            selectedShotLocation.courtX,
            selectedShotLocation.courtY,
            "pending",
            true
        );
        selectedShotLocationLabel.textContent =
            `Location: (${selectedShotLocation.x}, ${selectedShotLocation.y}) · ${selectedPlay}`;
        shotMadeButton.disabled = false;
        shotMissedButton.disabled = false;
        shotStatus.textContent = "Mark this shot made or missed.";
    }

    async function recordShot(result) {
        if (!gameId || !selectedShotLocation) {
            return;
        }
        shotMadeButton.disabled = true;
        shotMissedButton.disabled = true;
        try {
            await recordShotAttempt(gameId, {
                category: selectedCategory,
                type: selectedType,
                play: selectedPlay,
                zone: "Court coordinates",
                x: selectedShotLocation.x,
                y: selectedShotLocation.y,
                result
            });
            drawShotMarker(
                shotMarkers,
                selectedShotLocation.courtX,
                selectedShotLocation.courtY,
                result
            );
            selectedShotLocationLabel.textContent =
                `${result === "made" ? "Made" : "Missed"} · (${selectedShotLocation.x}, ${selectedShotLocation.y}) · ${selectedPlay}`;
            shotStatus.textContent = "Shot saved to this game.";
            selectedShotLocation = null;
            pendingShotMarker.replaceChildren();
        } catch (error) {
            console.error("Could not record shot:", error);
            shotStatus.textContent = "Could not save the shot. Please try again.";
        } finally {
            shotMadeButton.disabled = !selectedShotLocation || !gameId;
            shotMissedButton.disabled = !selectedShotLocation || !gameId;
        }
    }

    courtTapArea.addEventListener("click", event => {
        setShotLocation(event.clientX, event.clientY);
    });
    courtTapArea.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            const bounds = shotCourt.getBoundingClientRect();
            setShotLocation(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2);
        }
    });

    shotMadeButton.addEventListener("click", () => recordShot("made"));
    shotMissedButton.addEventListener("click", () => recordShot("missed"));

    function makeOption(label, isSelected, onSelect, className = "") {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `selector-option ${className}${isSelected ? " selected" : ""}`;
        button.textContent = label;
        button.setAttribute("aria-pressed", String(isSelected));
        button.addEventListener("click", onSelect);
        return button;
    }

    function renderCategories() {
        categoryOptions.replaceChildren();
        Object.keys(selectorConfig).forEach(category => {
            categoryOptions.appendChild(makeOption(
                category,
                category === selectedCategory,
                () => {
                    selectedCategory = category;
                    selectedType = Object.keys(selectorConfig[category])[0];
                    selectedPlay = selectorConfig[category][selectedType].plays[0];
                    clearShotLocation();
                    render();
                },
                category === "Offense" ? "offense-option" : "defense-option"
            ));
        });
    }

    function renderTypes() {
        typeOptions.replaceChildren();
        Object.keys(selectorConfig[selectedCategory]).forEach(type => {
            typeOptions.appendChild(makeOption(
                type,
                type === selectedType,
                () => {
                    selectedType = type;
                    selectedPlay = selectorConfig[selectedCategory][type].plays[0];
                    clearShotLocation();
                    render();
                }
            ));
        });
    }

    function renderPlays() {
        playOptions.replaceChildren();
        const typeConfig = selectorConfig[selectedCategory][selectedType];
        typeConfig.plays.forEach((play, index) => {
            playOptions.appendChild(makeOption(
                play,
                play === selectedPlay,
                () => {
                    selectedPlay = play;
                    clearShotLocation();
                    render();
                },
                `play-color-${(index % 5) + 1}`
            ));
        });
    }

    let statsRenderVersion = 0;

    async function renderStats(renderVersion) {
        statOptions.replaceChildren();
        const typeConfig = selectorConfig[selectedCategory][selectedType];
        const categoryKey = typeConfig.category;
        const play = selectedPlay;
        const counters = selectedCategory === "Defense"
            ? defenseCounters
            : offenseCounters;
        const record = gameId
            ? await loadPlayStats(gameId, categoryKey, play)
            : null;
        if (renderVersion !== statsRenderVersion) {
            return;
        }

        counters.forEach((counter, index) => {
            const card = document.createElement("div");
            card.className = `inline-stat stat-${(index % 5) + 1}`;

            const minusButton = document.createElement("button");
            minusButton.type = "button";
            minusButton.className = "inline-stat-control";
            minusButton.textContent = "−";
            minusButton.setAttribute("aria-label", `Subtract 1 from ${counter}`);

            const label = document.createElement("span");
            label.className = "inline-stat-label";
            label.textContent = counter;

            const value = document.createElement("span");
            value.className = "inline-stat-value";
            value.textContent = record?.counters?.[counter] ?? 0;

            const plusButton = document.createElement("button");
            plusButton.type = "button";
            plusButton.className = "inline-stat-control";
            plusButton.textContent = "+";
            plusButton.setAttribute("aria-label", `Add 1 to ${counter}`);

            const updateCount = async delta => {
                if (!gameId) {
                    alert("Start or resume a game before changing stats.");
                    return;
                }

                minusButton.disabled = true;
                plusButton.disabled = true;
                try {
                    const updated = await adjustPlayStat(
                        gameId,
                        categoryKey,
                        play,
                        counter,
                        delta
                    );
                    value.textContent = updated.counters[counter];
                } catch (error) {
                    console.error("Could not update stat:", error);
                    alert("Could not update this stat. Please try again.");
                } finally {
                    minusButton.disabled = false;
                    plusButton.disabled = false;
                }
            };

            minusButton.addEventListener("click", () => updateCount(-1));
            plusButton.addEventListener("click", () => updateCount(1));
            card.append(minusButton, label, value, plusButton);
            statOptions.appendChild(card);
        });
    }

    function render() {
        renderCategories();
        renderTypes();
        renderPlays();
        refreshShotMarkers().catch(error => {
            console.error("Could not load saved shots:", error);
            shotStatus.textContent = "Could not load saved shots.";
        });
        const renderVersion = ++statsRenderVersion;
        renderStats(renderVersion).catch(error => {
            if (renderVersion !== statsRenderVersion) {
                return;
            }
            console.error("Could not load stats:", error);
            statOptions.textContent = "Could not load stats for this play.";
        });
    }

    async function initialize() {
        if (gameId) {
            const game = await loadGame(gameId);
            if (game) {
                document.getElementById("active-game-label").textContent =
                    `${game.opponent} | ${game.date} | ${game.homeaway}`;
            }
        }
        clearShotLocation();
        await refreshShotMarkers();
        render();
    }

    initialize().catch(error => {
        console.error("Could not initialize tracker:", error);
        document.getElementById("active-game-label").textContent =
            "Could not load the active game.";
        render();
    });
</script>
