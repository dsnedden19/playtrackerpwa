<link rel="stylesheet" href="/static/style.css">

<div class="container selector-container">
    <header class="selector-header">
        <div>
            <h2>Game Tracker</h2>
            <p id="active-game-label">Choose a category, type, play, then record stats.</p>
        </div>
        <nav class="selector-nav">
            <a href="/summary" class="button">Summary</a>
            <a href="/" class="button">Home</a>
        </nav>
    </header>

    <main class="selector-board">
        <div class="selector-left-stack">
            <section class="selector-panel category-panel">
                <h3>Category</h3>
                <div id="category-options" class="selector-options"></div>
            </section>
            <section class="selector-panel type-panel">
                <h3>Type</h3>
                <div id="type-options" class="selector-options"></div>
            </section>
        </div>
        <section class="selector-panel plays-panel">
            <h3>Plays</h3>
            <div id="play-options" class="play-options"></div>
        </section>
        <section class="selector-panel stats-panel">
            <h3>Stats</h3>
            <div id="stat-options" class="stat-options"></div>
        </section>
    </main>

    <section class="shot-tracker selector-panel" aria-labelledby="shot-tracker-title">
        <div class="shot-tracker-heading">
            <div>
                <h3 id="shot-tracker-title">Shot Location</h3>
                <p>Select where the shot was taken, then record whether it was made or missed.</p>
            </div>
            <p id="shot-status" role="status" aria-live="polite">Choose a court area.</p>
        </div>

        <div class="shot-tracker-content">
            <div class="court-scroll">
                <svg class="shot-court" viewBox="0 0 500 340" role="group" aria-labelledby="court-title court-description">
                    <title id="court-title">Six-area basketball shot selector</title>
                    <desc id="court-description">Select one of six court areas: left two-point, paint, right two-point, left three-point, top three-point, or right three-point.</desc>
                    <rect class="court-floor" x="20" y="15" width="460" height="310" rx="8"></rect>

                    <g class="shot-zone" data-zone="Left 2PT" role="button" tabindex="0" aria-label="Select left two-point area">
                        <path d="M25 20 H190 V170 Q165 204 125 245 H25 Z"></path>
                        <text x="95" y="120">Left 2PT</text>
                    </g>
                    <g class="shot-zone" data-zone="Paint" role="button" tabindex="0" aria-label="Select paint">
                        <path d="M190 20 H310 V170 Q250 210 190 170 Z"></path>
                        <text x="250" y="115">Paint</text>
                    </g>
                    <g class="shot-zone" data-zone="Right 2PT" role="button" tabindex="0" aria-label="Select right two-point area">
                        <path d="M310 20 H475 V245 H375 Q335 204 310 170 Z"></path>
                        <text x="405" y="120">Right 2PT</text>
                    </g>
                    <g class="shot-zone" data-zone="Left 3PT" role="button" tabindex="0" aria-label="Select left three-point area">
                        <path d="M25 245 H125 Q165 204 190 170 L160 320 H25 Z"></path>
                        <text x="88" y="285">Left 3PT</text>
                    </g>
                    <g class="shot-zone" data-zone="Top 3PT" role="button" tabindex="0" aria-label="Select top three-point area">
                        <path d="M190 170 Q250 210 310 170 L340 320 H160 Z"></path>
                        <text x="250" y="280">Top 3PT</text>
                    </g>
                    <g class="shot-zone" data-zone="Right 3PT" role="button" tabindex="0" aria-label="Select right three-point area">
                        <path d="M310 170 Q335 204 375 245 H475 V320 H340 Z"></path>
                        <text x="412" y="285">Right 3PT</text>
                    </g>

                    <g class="court-markings" aria-hidden="true">
                        <rect x="190" y="20" width="120" height="150"></rect>
                        <path d="M190 170 A60 60 0 0 0 310 170"></path>
                        <path d="M55 320 A195 195 0 0 1 445 320"></path>
                        <line x1="220" y1="48" x2="280" y2="48"></line>
                        <circle cx="250" cy="58" r="12"></circle>
                        <line x1="20" y1="15" x2="480" y2="15"></line>
                        <line x1="20" y1="325" x2="480" y2="325"></line>
                    </g>
                </svg>
            </div>

            <div class="shot-result-panel">
                <p id="selected-shot-zone">No area selected</p>
                <div class="shot-result-buttons">
                    <button type="button" id="shot-made" class="shot-result made" disabled>Made</button>
                    <button type="button" id="shot-missed" class="shot-result missed" disabled>Missed</button>
                </div>
                <h4>Recent shots</h4>
                <ol id="recent-shots" class="recent-shots"></ol>
            </div>
        </div>
    </section>
</div>

<script src="/static/storage.js"></script>
<script>
    const selectorConfig = {{ selector_config | tojson }};
    const offenseCounters = {{ offense_counters | tojson }};
    const defenseCounters = {{ defense_counters | tojson }};
    const gameId = localStorage.getItem("activeGameId");

    let selectedCategory = "Offense";
    let selectedType = "Man";
    let selectedPlay = selectorConfig[selectedCategory][selectedType].plays[0];
    let selectedShotZone = null;

    const categoryOptions = document.getElementById("category-options");
    const typeOptions = document.getElementById("type-options");
    const playOptions = document.getElementById("play-options");
    const statOptions = document.getElementById("stat-options");
    const selectedShotZoneLabel = document.getElementById("selected-shot-zone");
    const shotStatus = document.getElementById("shot-status");
    const shotMadeButton = document.getElementById("shot-made");
    const shotMissedButton = document.getElementById("shot-missed");
    const recentShotsList = document.getElementById("recent-shots");

    function clearShotZone() {
        selectedShotZone = null;
        document.querySelectorAll(".shot-zone").forEach(zone => {
            zone.classList.remove("selected");
            zone.setAttribute("aria-pressed", "false");
        });
        selectedShotZoneLabel.textContent = "No area selected";
        shotMadeButton.disabled = true;
        shotMissedButton.disabled = true;
        shotStatus.textContent = gameId
            ? "Choose a court area."
            : "Start or resume a game before recording shots.";
    }

    function selectShotZone(zoneElement) {
        selectedShotZone = zoneElement.dataset.zone;
        document.querySelectorAll(".shot-zone").forEach(zone => {
            const isSelected = zone === zoneElement;
            zone.classList.toggle("selected", isSelected);
            zone.setAttribute("aria-pressed", String(isSelected));
        });
        selectedShotZoneLabel.textContent = selectedShotZone;
        shotMadeButton.disabled = !gameId;
        shotMissedButton.disabled = !gameId;
        shotStatus.textContent = gameId
            ? `Ready to record ${selectedShotZone} for ${selectedPlay}.`
            : "Start or resume a game before recording shots.";
    }

    document.querySelectorAll(".shot-zone").forEach(zone => {
        zone.setAttribute("aria-pressed", "false");
        zone.addEventListener("click", () => selectShotZone(zone));
        zone.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                selectShotZone(zone);
            }
        });
    });

    async function refreshRecentShots() {
        if (!gameId) {
            recentShotsList.innerHTML = "<li>Start or resume a game to record shots.</li>";
            return;
        }
        const shots = await loadGameShots(gameId);
        recentShotsList.replaceChildren();
        shots.slice(-5).reverse().forEach(shot => {
            const item = document.createElement("li");
            item.textContent =
                `${shot.result === "made" ? "Made" : "Missed"} · ${shot.zone} · ${shot.play}`;
            recentShotsList.appendChild(item);
        });
        if (!shots.length) {
            const item = document.createElement("li");
            item.textContent = "No shots recorded yet.";
            recentShotsList.appendChild(item);
        }
    }

    async function recordShot(result) {
        if (!gameId || !selectedShotZone) {
            return;
        }
        shotMadeButton.disabled = true;
        shotMissedButton.disabled = true;
        try {
            await recordShotAttempt(gameId, {
                category: selectedCategory,
                type: selectedType,
                play: selectedPlay,
                zone: selectedShotZone,
                result
            });
            shotStatus.textContent =
                `${result === "made" ? "Made" : "Missed"} shot saved · ${selectedShotZone} · ${selectedPlay}`;
            await refreshRecentShots();
        } catch (error) {
            console.error("Could not record shot:", error);
            shotStatus.textContent = "Could not save the shot. Please try again.";
        } finally {
            shotMadeButton.disabled = !selectedShotZone || !gameId;
            shotMissedButton.disabled = !selectedShotZone || !gameId;
        }
    }

    shotMadeButton.addEventListener("click", () => recordShot("made"));
    shotMissedButton.addEventListener("click", () => recordShot("missed"));

    function makeOption(label, isSelected, onSelect, className = "") {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `selector-option ${className}${isSelected ? " selected" : ""}`;
        button.textContent = label;
        button.setAttribute("aria-pressed", String(isSelected));
        button.addEventListener("click", onSelect);
        return button;
    }

    function renderCategories() {
        categoryOptions.replaceChildren();
        Object.keys(selectorConfig).forEach(category => {
            categoryOptions.appendChild(makeOption(
                category,
                category === selectedCategory,
                () => {
                    selectedCategory = category;
                    selectedType = Object.keys(selectorConfig[category])[0];
                    selectedPlay = selectorConfig[category][selectedType].plays[0];
                    clearShotZone();
                    render();
                },
                category === "Offense" ? "offense-option" : "defense-option"
            ));
        });
    }

    function renderTypes() {
        typeOptions.replaceChildren();
        Object.keys(selectorConfig[selectedCategory]).forEach(type => {
            typeOptions.appendChild(makeOption(
                type,
                type === selectedType,
                () => {
                    selectedType = type;
                    selectedPlay = selectorConfig[selectedCategory][type].plays[0];
                    clearShotZone();
                    render();
                }
            ));
        });
    }

    function renderPlays() {
        playOptions.replaceChildren();
        const typeConfig = selectorConfig[selectedCategory][selectedType];
        typeConfig.plays.forEach((play, index) => {
            playOptions.appendChild(makeOption(
                play,
                play === selectedPlay,
                () => {
                    selectedPlay = play;
                    clearShotZone();
                    render();
                },
                `play-color-${(index % 5) + 1}`
            ));
        });
    }

    let statsRenderVersion = 0;

    async function renderStats(renderVersion) {
        statOptions.replaceChildren();
        const typeConfig = selectorConfig[selectedCategory][selectedType];
        const categoryKey = typeConfig.category;
        const play = selectedPlay;
        const counters = selectedCategory === "Defense"
            ? defenseCounters
            : offenseCounters;
        const record = gameId
            ? await loadPlayStats(gameId, categoryKey, play)
            : null;
        if (renderVersion !== statsRenderVersion) {
            return;
        }

        counters.forEach((counter, index) => {
            const card = document.createElement("div");
            card.className = `inline-stat stat-${(index % 5) + 1}`;

            const minusButton = document.createElement("button");
            minusButton.type = "button";
            minusButton.className = "inline-stat-control";
            minusButton.textContent = "−";
            minusButton.setAttribute("aria-label", `Subtract 1 from ${counter}`);

            const label = document.createElement("span");
            label.className = "inline-stat-label";
            label.textContent = counter;

            const value = document.createElement("span");
            value.className = "inline-stat-value";
            value.textContent = record?.counters?.[counter] ?? 0;

            const plusButton = document.createElement("button");
            plusButton.type = "button";
            plusButton.className = "inline-stat-control";
            plusButton.textContent = "+";
            plusButton.setAttribute("aria-label", `Add 1 to ${counter}`);

            const updateCount = async delta => {
                if (!gameId) {
                    alert("Start or resume a game before changing stats.");
                    return;
                }

                minusButton.disabled = true;
                plusButton.disabled = true;
                try {
                    const updated = await adjustPlayStat(
                        gameId,
                        categoryKey,
                        play,
                        counter,
                        delta
                    );
                    value.textContent = updated.counters[counter];
                } catch (error) {
                    console.error("Could not update stat:", error);
                    alert("Could not update this stat. Please try again.");
                } finally {
                    minusButton.disabled = false;
                    plusButton.disabled = false;
                }
            };

            minusButton.addEventListener("click", () => updateCount(-1));
            plusButton.addEventListener("click", () => updateCount(1));
            card.append(minusButton, label, value, plusButton);
            statOptions.appendChild(card);
        });
    }

    function render() {
        renderCategories();
        renderTypes();
        renderPlays();
        refreshRecentShots().catch(error => {
            console.error("Could not load recent shots:", error);
            recentShotsList.textContent = "Could not load recent shots.";
        });
        const renderVersion = ++statsRenderVersion;
        renderStats(renderVersion).catch(error => {
            if (renderVersion !== statsRenderVersion) {
                return;
            }
            console.error("Could not load stats:", error);
            statOptions.textContent = "Could not load stats for this play.";
        });
    }

    async function initialize() {
        if (gameId) {
            const game = await loadGame(gameId);
            if (game) {
                document.getElementById("active-game-label").textContent =
                    `${game.opponent} | ${game.date} | ${game.homeaway}`;
            }
        }
        clearShotZone();
        await refreshRecentShots();
        render();
    }

    initialize().catch(error => {
        console.error("Could not initialize tracker:", error);
        document.getElementById("active-game-label").textContent =
            "Could not load the active game.";
        render();
    });
</script>
