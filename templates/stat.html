<link rel="stylesheet" href="/static/style.css">

<div class="container">
    <h2>{{ play }} ({{ category }})</h2>

    <div class="button-grid stat-grid">
        {% for c in counters %}
            {% set color = (loop.index0 % 5) + 1 %}
            <div class="button stat-{{ color }} stat-counter">
                <button
                    class="stat-adjust stat-minus"
                    type="button"
                    data-counter="{{ c }}"
                    data-delta="-1"
                    aria-label="Subtract 1 from {{ c }}">
                    −
                </button>
                <span class="stat-label">
                    <span class="stat-name">{{ c }}</span>
                    <span class="stat-total">{{ values[c] }}</span>
                </span>
                <button
                    class="stat-adjust stat-plus"
                    type="button"
                    data-counter="{{ c }}"
                    data-delta="1"
                    aria-label="Add 1 to {{ c }}">
                    +
                </button>
            </div>
        {% endfor %}

        <a href="/category" class="button" style="background-color: gray;">
            Back to Categories
        </a>

        <a href="/summary" class="button" style="background-color: black;">
            View Summary
        </a>
    </div>
</div>

<script src="/static/storage.js"></script>
<script>
    const gameId = localStorage.getItem("activeGameId");
    const category = {{ category | tojson }};
    const play = {{ play | tojson }};

    async function refreshStatCounts() {
        if (!gameId) {
            return;
        }

        const record = await loadPlayStats(gameId, category, play);
        document.querySelectorAll(".stat-counter").forEach(card => {
            const counter = card.querySelector(".stat-adjust").dataset.counter;
            card.querySelector(".stat-total").textContent =
                record?.counters?.[counter] ?? 0;
        });
    }

    document.querySelectorAll(".stat-adjust").forEach(button => {
        button.addEventListener("click", async () => {
            if (!gameId) {
                alert("Start or resume a game before changing stats.");
                return;
            }

            const card = button.closest(".stat-counter");
            const total = card.querySelector(".stat-total");
            const counter = button.dataset.counter;
            const delta = Number(button.dataset.delta);

            button.disabled = true;
            try {
                const record = await adjustPlayStat(
                    gameId,
                    category,
                    play,
                    counter,
                    delta
                );
                total.textContent = record.counters[counter];
            } catch (error) {
                console.error("Could not update stat:", error);
                alert("Could not update this stat. Please try again.");
            } finally {
                button.disabled = false;
            }
        });
    });

    refreshStatCounts().catch(error => {
        console.error("Could not load stat counts:", error);
        alert("Could not load the saved stats for this play.");
    });
</script>
