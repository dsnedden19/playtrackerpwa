<link rel="stylesheet" href="/static/style.css">

<div class="container">
    <h2>{{ play }} ({{ category }})</h2>

    <div class="button-grid">
        {% for c in counters %}
            {% set color = (loop.index0 % 5) + 1 %}
            <div class="stat-card stat-{{ color }}">
                <div class="stat-card-header">{{ c }}</div>
                <div class="stat-total">{{ values[c] }}</div>

                <div class="stat-split">
                    <button
                        type="button"
                        class="stat-half stat-half-left"
                        data-counter="{{ c }}"
                        data-delta="1"
                        aria-label="Add 1 to {{ c }}">
                        +1
                    </button>
                    <button
                        type="button"
                        class="stat-half stat-half-right"
                        data-counter="{{ c }}"
                        data-delta="-1"
                        aria-label="Subtract 1 from {{ c }}">
                        −1
                    </button>
                </div>
            </div>
        {% endfor %}

        <a href="/category" class="button secondary-btn">Back to Categories</a>
        <a href="/summary" class="button dark-btn">View Summary</a>
    </div>
</div>

<script src="/static/storage.js"></script>
<script>
    const gameId = localStorage.getItem("activeGameId");
    const category = {{ category | tojson }};
    const play = {{ play | tojson }};

    async function loadDisplayedCounts() {
        if (!gameId) {
            return;
        }

        const record = await loadPlayStats(gameId, category, play);
        document.querySelectorAll(".stat-card").forEach(card => {
            const counter = card.querySelector(".stat-half").dataset.counter;
            card.querySelector(".stat-total").textContent =
                record?.counters?.[counter] ?? 0;
        });
    }

    document.querySelectorAll(".stat-half").forEach(button => {
        button.addEventListener("click", async () => {
            if (!gameId) {
                alert("Start or resume a game before changing stats.");
                return;
            }

            const card = button.closest(".stat-card");
            const total = card.querySelector(".stat-total");
            const counter = button.dataset.counter;
            const delta = Number(button.dataset.delta);

            button.disabled = true;
            try {
                const record = await adjustPlayStat(
                    gameId,
                    category,
                    play,
                    counter,
                    delta
                );
                total.textContent = record.counters[counter];
            } catch (error) {
                console.error("Could not update stat:", error);
                alert("Could not update this stat. Please try again.");
            } finally {
                button.disabled = false;
            }
        });
    });

    loadDisplayedCounts().catch(error => {
        console.error("Could not load stat counts:", error);
        alert("Could not load the saved stats for this play.");
    });
</script>
