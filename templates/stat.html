<link rel="stylesheet" href="/static/style.css">

<div class="container">
    <h2>{{ play }} ({{ category }})</h2>

    <div class="button-grid">
        {% for c in counters %}
            {% set color = (loop.index0 % 5) + 1 %}
            <div class="stat-card stat-{{ color }}">
                <div class="stat-card-header">{{ c }}</div>
                <div class="stat-total">{{ values[c] }}</div>

                <div class="stat-split">
                    <form method="POST" class="stat-form">
                        <input type="hidden" name="counter" value="{{ c }}">
                        <input type="hidden" name="delta" value="-1">
                        <button type="submit" class="stat-half stat-half-left" aria-label="Subtract 1 from {{ c }}">
                            −1
                        </button>
                    </form>

                    <form method="POST" class="stat-form">
                        <input type="hidden" name="counter" value="{{ c }}">
                        <input type="hidden" name="delta" value="1">
                        <button type="submit" class="stat-half stat-half-right" aria-label="Add 1 to {{ c }}">
                            +1
                        </button>
                    </form>
                </div>
            </div>
        {% endfor %}

        <a href="/category" class="button secondary-btn">Back to Categories</a>
        <a href="/summary" class="button dark-btn">View Summary</a>
    </div>
</div>
